# CI — runs on every push and pull request.
#
# Three gates, in increasing cost order. The point of a pipeline is that the
# cheap check fails first: no sense spending 90s on a Docker build to find out
# a test was red.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.23"          # same resolver the Dockerfile uses
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change that was never locked cannot merge. This is the gate
      # that keeps "it works on my machine" from meaning "and nowhere else".
      - name: Install dependencies (locked)
        run: uv sync --frozen

      # The repo is public and the parent project is personal health data.
      # This scanner blocks credentials and health-data paths; it runs as a
      # pre-commit hook locally, and here as the backstop for `--no-verify`.
      - name: Guard against committed secrets / health data
        run: python3 scripts/check_publishable.py --all

      - name: Tests
        run: uv run --frozen python -m pytest tests/ -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — no push. Catches a broken Dockerfile or a .dockerignore
      # that excluded something the build needs, on the branch rather than at
      # release time.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap assertion that the deny-by-default .dockerignore is doing its job.
      # If this ever fails, the published image is leaking and the tag must be
      # deleted, not patched — layers are immutable.
      - name: Assert no secrets or health data in the image
        run: |
          docker build -q -t coach-sync:ci-check .
          # --user root, for two reasons. The image runs as uid 1000, and a
          # non-root `find /` (a) cannot traverse /root, so a secret there
          # would be missed, and (b) exits 1 on permission-denied, which under
          # `bash -e` aborted this step before the check even ran. The result
          # was a red build that proved nothing.
          # `|| true` keeps a find exit code from masking the real assertion.
          found=$(docker run --rm --user root --entrypoint sh coach-sync:ci-check -c \
            'find / -xdev \( -name ".env" -o -name ".env.*" -o -name "manual.csv" \
                          -o -name "campaign.toml" -o -name "metrics_*.csv" \) -print 2>/dev/null || true')
          if [ -n "$found" ]; then
            echo "::error::sensitive files present in the image:"; echo "$found"; exit 1
          fi
          echo "image is clean"
